<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5f2" />
  <meta name="description" content="把每一次坚持，存进自己的小金库。独立、离线、属于你的奖励器。" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
  <title>拾光奖励 · 每一点努力都值得</title>
</head>
<body>
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3.5 10 8.5-7 8.5 7v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M9 21v-7h6v7"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18M16 14h2M6 5V4a1 1 0 0 1 1-1h11"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.2 15.2 21 16l-2 3.5-1.9-.4a8 8 0 0 1-2.3 1.3L14 22h-4l-.8-1.6a8 8 0 0 1-2.3-1.3L5 19.5 3 16l1.8-.8a8 8 0 0 1 0-2.5L3 12l2-3.5 1.9.4A8 8 0 0 1 9.2 7.6L10 6h4l.8 1.6a8 8 0 0 1 2.3 1.3l1.9-.4 2 3.5-1.8.7a8 8 0 0 1 0 2.5z" transform="translate(0 -1) scale(1 .95)"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3z"/><path d="m19 2 .6 2.4L22 5l-2.4.6L19 8l-.6-2.4L16 5l2.4-.6z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 16-.7 4.7L8 20l11-11-4-4zM13.5 6.5l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 17v4h16v-4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 1 1 8 0v3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.2v.3"/></symbol>
  </svg>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div class="app-shell" id="app">
    <header class="topbar" id="topbar">
      <div class="brand" aria-label="拾光奖励"><span class="brand-mark" aria-hidden="true">✳</span><span class="brand-copy"><b>拾光奖励</b><small>EVERY LITTLE WIN</small></span></div>
      <button class="top-vault-chip" id="header-balance" type="button" aria-label="打开奖励金库">
        <span class="chip-coin" aria-hidden="true">✦</span>
        <span class="chip-label">累计</span>
        <strong id="header-amount">¥0.00</strong>
        <svg aria-hidden="true"><use href="#i-arrow"></use></svg>
      </button>
    </header>
    <main id="main" class="main-shell" tabindex="-1"><div class="screen" id="screen"></div></main>
    <nav class="bottom-nav" aria-label="主导航">
      <span class="nav-thumb" id="nav-thumb" aria-hidden="true"></span>
      <button class="nav-btn active" data-view="home" type="button" aria-current="page"><svg><use href="#i-home"></use></svg><span>我的目标</span></button>
      <button class="nav-btn" data-view="wallet" type="button"><svg><use href="#i-wallet"></use></svg><span>奖励金库</span></button>
      <button class="nav-btn" data-view="settings" type="button"><svg><use href="#i-settings"></use></svg><span>设置</span></button>
    </nav>
  </div>
  <div id="sheet-root"></div><div id="toast-root" aria-live="polite" aria-atomic="true"></div><div id="flight-root" aria-hidden="true"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden />
  <script type="module" src="./app.js"></script>
</body>
</html>
