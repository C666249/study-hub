name: FoldFrame signed APK v0.1.1 Beta
on:
  push:
    branches: [release/foldframe-v0.1.0-beta]
    paths:
      - '.github/workflows/foldframe-release.yml'
      - 'apps/foldframe/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-apk-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK and apksigner
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/35.0.0/apksigner" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble V1 + V2 + V3 debug signed APK
        working-directory: apps/foldframe
        run: gradle --no-daemon :app:clean :app:assembleDebug --stacktrace
      - name: Verify signature and prepare public APK
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/foldframe/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs --min-sdk-version 29 "$APK" | tee signature-verification.txt
          grep -Eq 'Verified using v1 scheme \(JAR signing\): true' signature-verification.txt
          grep -Eq 'Verified using v2 scheme \(APK Signature Scheme v2\): true' signature-verification.txt
          grep -Eq 'Verified using v3 scheme \(APK Signature Scheme v3\): true' signature-verification.txt
          unzip -Z1 "$APK" | grep -Eq '^META-INF/.*\.(RSA|DSA|EC)$'
          cp "$APK" FoldFrame-v0.1.1-Beta-Signed.apk
          sha256sum FoldFrame-v0.1.1-Beta-Signed.apk > FoldFrame-v0.1.1-Beta-Signed.sha256
          ls -lh FoldFrame-v0.1.1-Beta-Signed.apk
      - name: Publish verified public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: foldframe-v0.1.1-beta
          name: FoldFrame v0.1.1 Beta (V1+V2+V3 signed)
          target_commitish: release/foldframe-v0.1.0-beta
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            FoldFrame-v0.1.1-Beta-Signed.apk
            FoldFrame-v0.1.1-Beta-Signed.sha256
            signature-verification.txt
          body: |
            - Fix: explicitly enable APK V1, V2, V3 signing schemes for Huawei / HONOR installation compatibility.
            - GitHub Actions will only publish after apksigner verifies certificate and all three signing schemes.
            - FoldFrame Android 10+ offline photography album.
            - This beta uses a CI-generated debug certificate, not a Play Store release certificate. Future rebuilds may use a different debug certificate; uninstall previous beta if Android reports a signature conflict.
            - Not yet real-device-tested on HONOR MagicOS.
