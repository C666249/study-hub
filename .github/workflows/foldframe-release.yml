name: FoldFrame APK v0.1.1 Beta (verified triple scheme)
on:
  push:
    branches: [release/foldframe-v0.1.0-beta]
    paths:
      - '.github/workflows/foldframe-release.yml'
      - 'apps/foldframe/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-apk-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK and official signing tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ] || [ ! -x "$SDK_ROOT/build-tools/35.0.0/apksigner" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
          "$SDK_ROOT/build-tools/35.0.0/apksigner" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble unsigned Release variant
        working-directory: apps/foldframe
        run: gradle --no-daemon :app:clean :app:assembleRelease --stacktrace
      - name: Align and explicitly sign with V1 V2 V3
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD="$SDK_ROOT/build-tools/35.0.0"
          UNSIGNED="apps/foldframe/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK="FoldFrame-v0.1.1-Beta-Signed.apk"
          test -s "$UNSIGNED"
          KEYSTORE="$RUNNER_TEMP/foldframe-beta.keystore"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass android -alias foldframebeta -keypass android -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=FoldFrame Beta, OU=Android Beta, O=FoldFrame, C=US"
          "$BUILD/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/foldframe-aligned.apk"
          "$BUILD/apksigner" sign \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --ks "$KEYSTORE" --ks-key-alias foldframebeta --ks-pass pass:android --key-pass pass:android \
            --out "$APK" "$RUNNER_TEMP/foldframe-aligned.apk"
          "$BUILD/zipalign" -c -v 4 "$APK"
          # Verify independently at three Android signature-generation boundaries.
          "$BUILD/apksigner" verify --min-sdk-version 21 "$APK"
          "$BUILD/apksigner" verify --min-sdk-version 24 "$APK"
          "$BUILD/apksigner" verify --min-sdk-version 29 "$APK"
          "$BUILD/apksigner" verify --verbose --print-certs --min-sdk-version 21 "$APK" | tee signature-verification.txt
          unzip -Z1 "$APK" | grep -E '^META-INF/.*\.(RSA|DSA|EC)$'
          grep -q 'Number of signers: 1' signature-verification.txt
          sha256sum "$APK" > FoldFrame-v0.1.1-Beta-Signed.sha256
          ls -lh "$APK"
      - name: Publish verified public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: foldframe-v0.1.1-beta
          name: FoldFrame v0.1.1 Beta (verified signed)
          target_commitish: release/foldframe-v0.1.0-beta
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            FoldFrame-v0.1.1-Beta-Signed.apk
            FoldFrame-v0.1.1-Beta-Signed.sha256
            signature-verification.txt
          body: |
            Android 10+ FoldFrame offline photography magazine. Fixed signing compatibility:
            built **unsigned release variant**, then zipaligned and independently signed with
            official Android apksigner (V1, V2 and V3 enabled). Verified for min-SDK 21, 24 and 29.
            Beta signed using CI-only temporary certificate. If replacing a previous beta signed
            with another certificate, uninstall that beta first. No previous Stable apps affected.
            Device-specific HONOR MagicOS install testing still pending.
