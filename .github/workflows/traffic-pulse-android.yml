name: PulseFlow · Android Preview APK
on:
  push:
    branches: ['feature/pulseflow-v031']
    paths:
      - 'android/trafficpulse/**'
      - 'android/settings.gradle.kts'
      - '.github/workflows/traffic-pulse-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -r | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Source privacy & foreground-service policy checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          x=Path('android/trafficpulse/src/main/AndroidManifest.xml').read_text()
          assert 'android.permission.INTERNET' not in x
          assert 'android.permission.ACCESS_NETWORK_STATE' in x
          assert 'android.permission.PACKAGE_USAGE_STATS' in x
          assert 'android.permission.INTERNET' not in x
          assert 'android:foregroundServiceType="specialUse"' in x
          assert 'FOREGROUND_SERVICE_SPECIAL_USE' in x
          assert 'android.permission.SYSTEM_ALERT_WINDOW' in x
          assert 'android:exported="false"' in x
          assert 'android:allowBackup="false"' in x
          print("Permissions, privacy, and foreground-service declarations verified")
          PY
      - name: Ensure liquid pill motion and privacy contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android/trafficpulse/src/main/java/io/github/c666249/trafficpulse')
          src=(root/'LiquidPillOverlay.java').read_text()
          assert 'ValueAnimator.ofInt(from,target)' in src
          assert 'setDuration(420L)' in src
          assert 'collapsedWidth = dp(96)' in src
          assert 'height = dp(36)' in src
          assert 'collapsedText.setText(String.format(Locale.US,"%.2fG"' in src
          assert 'collapsedText.setText("剩余' not in src
          assert 'postDelayed(longPress,490)' in src
          assert 'Math.min(dp(350)' in src
          assert 'collapsedText.setText' in src
          assert 'windowManager.updateViewLayout' in src
          assert 'MediaProjection' not in src
          main=(root/'MainActivity.java').read_text()
          assert main.index('quotaRemaining=label') < main.index('graph=new SpeedGraph')
          assert 'PulseFlow' in main
          print('Overlay motion, privacy and quota-first layout contract verified.')
          PY
      - name: Compile Android Debug APK
        run: bash android/gradlew -p android --no-daemon :trafficpulse:assembleDebug --stacktrace
      - name: Verify APK contents, package and debug signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=android/trafficpulse/build/outputs/apk/debug/trafficpulse-debug.apk
          test -s "$apk"
          cp "$apk" dist/PulseFlow-v0.3.1-preview.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --verbose dist/PulseFlow-v0.3.1-preview.apk
          "$AAPT" dump badging dist/PulseFlow-v0.3.1-preview.apk | grep -F "package: name='io.github.c666249.pulseflow' versionCode='4' versionName='0.3.1'"
          "$AAPT" dump permissions dist/PulseFlow-v0.3.1-preview.apk > /tmp/perms.txt
          if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then
            echo "Unexpected Internet permission detected!"; exit 1
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PulseFlow-Android-Preview-v0.3.1
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=pulseflow-v0.3.1-preview
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Preview tag already exists; refusing to silently replace binary"
          else
            gh release create "$tag" dist/PulseFlow-v0.3.1-preview.apk dist/SHA256SUMS.txt \
              --title "PulseFlow v0.3.1 · Micro Balance Pill" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --notes "PulseFlow v0.3.1: micro 96dp x 36dp balance-only collapsed pill; compact quota-first dashboard (the approved design), single-row VPN/network and RX/TX, 60s graph last, dark minimalist plan dialog. Compact translucent white horizontal overlay pill: collapsed remaining data, tap expands continuously to remaining/used/download/upload, long-press reverses, drag to move. Native code uses Android TrafficStats + NetworkStatsManager, no INTERNET permission. System overlay uses translucent white gradient fallback rather than screen capture or claiming optical backdrop refraction. Package io.github.c666249.pulseflow (independent from old Traffic Pulse); usage-access and draw-over-apps permissions must be granted again. Signed with ephemeral CI debug certificate; no in-place signature continuity guarantee. Android hardware performance and MagicOS permissions not yet device-verified."
          fi
