name: App Factory · Public APK Preview
on:
  push:
    branches: ['factory/demo-v01']
    paths:
      - 'android/factory-demo/**'
      - 'android/settings.gradle.kts'
      - '.github/workflows/app-factory-public-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK with preinstalled command-line tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -r | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble isolated public demo
        run: bash android/gradlew -p android --no-daemon :factory-demo:assembleDebug
      - name: Verify artifact and fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=android/factory-demo/build/outputs/apk/debug/factory-demo-debug.apk
          test -s "$APK"
          cp "$APK" dist/AppFactoryDemo-v0.1.1-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/AppFactoryDemo-v0.1.1-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/AppFactoryDemo-v0.1.1-debug.apk | head -n 1
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: AppFactory-Public-Demo-v0.1.1
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish immutable public prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=app-factory-demo-v0.1.1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release exists: avoiding binary replacement."
          else
            gh release create "$tag" dist/AppFactoryDemo-v0.1.1-debug.apk dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "App Factory Demo 0.1.1 (public preview)" \
              --notes "Public original Android UI proof only. Actual FMV source integration remains in private personal-app-stack feature/app-factory-v1. This APK uses an ephemeral GitHub Actions debug signing identity: uninstall it before installing another build. Do not treat this as signed Stable." \
              --prerelease --latest=false
          fi
