name: Rewarder Android APK
on:
  push:
    branches: [master]
    paths:
      - 'android/rewarder/**'
      - 'android/settings.gradle.kts'
      - '.github/workflows/rewarder-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone Rewarder APK
        working-directory: android
        run: bash ./gradlew :rewarder:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Shiguang-Rewarder-1.0.0-debug
          path: android/rewarder/build/outputs/apk/debug/rewarder-debug.apk
          if-no-files-found: error
          retention-days: 30
