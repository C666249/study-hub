name: Deploy to GitHub Pages
on:
  push:
    branches: [master, diagnose-streaming]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify complete Study Atelier release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/StudyAtelier-Mobile-v0.1.zip"
          if [ -d .atelier-parts ]; then
            cat .atelier-parts/p*.bin > "$archive"
            printf '%s  %s\n' '3f64016d6937c1ffa98b5a344118a950af14c4b93f83d67608a2a272c652f8b6' "$archive" | sha256sum -c -
            mkdir -p study-atelier
            unzip -oq "$archive" -d study-atelier
            test -s study-atelier/index.html
            test -s study-atelier/data.js
            test -d study-atelier/originals
            touch study-atelier/.nojekyll
            rm -rf .atelier-parts
            echo "Study Atelier verified at /study-hub/study-atelier/"
          else
            latest=$(find . -maxdepth 1 -type f -name 'StudyAtelier-Mobile-v*.zip' -print | sort -V | tail -n 1)
            if [ -n "$latest" ]; then
              mkdir -p study-atelier
              unzip -oq "$latest" -d study-atelier
              touch study-atelier/.nojekyll
              test -s study-atelier/index.html
            fi
          fi
      - name: Apply Study Atelier v0.2 knowledge and practice upgrade
        shell: bash
        run: |
          set -euo pipefail
          if [ -d study-atelier-overrides ]; then
            test -s study-atelier/index.html
            cp -a study-atelier-overrides/. study-atelier/
            test -s study-atelier/quiz-data.js
            test -s study-atelier/chapter-data.js
            test -s study-atelier/upgrade.js
            rm -rf study-atelier-overrides
            echo 'Study Atelier v0.2 upgrade applied'
          fi
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Validate FMV page and scene assets
        shell: bash
        run: |
          set -euo pipefail
          test -s fmv/index.html
          test -s fmv/fmv-real-scenes.js
          test -s fmv/fmv-real-scenes.css
          node --check fmv/fmv-real-scenes.js
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('fmv/index.html','utf8');
          const js = fs.readFileSync('fmv/fmv-real-scenes.js','utf8');
          if (!html.includes('window.FMVScenes=') || !html.includes('.fx-dock')) throw Error('FMV self-contained CSS/JS not embedded');
          if (html.includes('src="./fmv-real-scenes.js"')) throw Error('FMV must work as a standalone HTML');
          if (!js.includes('window.FMVScenes=')) throw Error('independent FMV scenes not registered');
          const ids=[...js.matchAll(/'((?:FMV|APP|PAGE)-[A-Z0-9-]+-\d{3})':'[a-z]+',?/g)];
          if(ids.length<30) throw Error('too few explicit scenes: '+ids.length);
          console.log('FMV scenes checked:',ids.length);
          NODE
      - name: Verify non-blank no-script fallback
        shell: bash
        run: |
          set -euo pipefail
          test -s fmv/lite.html
          grep -q 'id="fmv-fallback"' fmv/index.html
          grep -q 'class="fallback-entry"' fmv/index.html
          ! grep -qi '<script' fmv/lite.html
      - name: Headless browser render smoke test
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            set +e
            timeout 45s google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files --virtual-time-budget=2200 --dump-dom "file://$GITHUB_WORKSPACE/fmv/index.html" > "$RUNNER_TEMP/fmv-dom.html" 2> "$RUNNER_TEMP/fmv-chrome.log"
            chrome_status=$?
            set -e
            echo "Headless Chrome exit status: $chrome_status"
            echo "Headless DOM bytes: $(wc -c < "$RUNNER_TEMP/fmv-dom.html")"
            if [ "$chrome_status" -ne 0 ] || ! grep -q 'data-real="true"' "$RUNNER_TEMP/fmv-dom.html" || ! grep -q 'class="fx-chipset"' "$RUNNER_TEMP/fmv-dom.html" || ! grep -q 'class="fx-rubber"' "$RUNNER_TEMP/fmv-dom.html"; then
              echo "::error::FMV dynamic scenes did not render correctly."
              echo 'Chrome errors:'
              tail -n 30 "$RUNNER_TEMP/fmv-chrome.log"
              echo 'Dynamic scene markers:'
              grep -oE 'data-real="[^"]+"|class="fx-chipset"|class="fx-rubber"' "$RUNNER_TEMP/fmv-dom.html" | sort | uniq -c || true
              echo 'Rendered page body excerpt:'
              tail -c 1800 "$RUNNER_TEMP/fmv-dom.html"
              exit 1
            fi
            echo 'FMV live Jelly / Rubber stage DOM rendered successfully.'
            grep -q 'class="fallback-entry"' fmv/index.html
            test "$(grep -o 'class="fallback-entry"' fmv/index.html | wc -l)" -eq 84
            test "$(grep -o 'class="entry"' fmv/lite.html | wc -l)" -eq 84
            if grep -qi '<script' fmv/lite.html; then
              echo "::error::FMV lite must remain script-free"; exit 1
            fi
            timeout 45s google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --allow-file-access-from-files --window-size=390,844 --virtual-time-budget=1600 --dump-dom "file://$GITHUB_WORKSPACE/fmv/index.html" > "$RUNNER_TEMP/fmv-mobile.html" 2> "$RUNNER_TEMP/fmv-mobile-chrome.log"
            grep -q 'data-real="true"' "$RUNNER_TEMP/fmv-mobile.html"
            echo 'Mobile-size headless Chrome also rendered interactive scene cards.'
          else
            echo 'Chrome unavailable; Node syntax and source-file checks already passed.'
          fi
      - name: Wait for artifact indexing to avoid Pages API race
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry transient Pages artifact lookup failures
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Confirm Pages deployment
        shell: bash
        run: |
          if [ "${{ steps.deployment.outcome }}" != "success" ] && [ "${{ steps.deployment_retry.outcome }}" != "success" ]; then
            echo "::error::GitHub Pages deployment failed."
            exit 1
          fi
          echo 'Pages deployment completed.'
      - name: Probe live FMV URLs after deployment
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          for path in fmv/ fmv/lite.html; do
            url="https://c666249.github.io/study-hub/$path"
            echo "Checking live site: $url"
            curl -fLsS --retry 4 --retry-delay 3 --connect-timeout 12 --max-time 40 -o "$RUNNER_TEMP/fmv-live.html" -w "HTTP %{http_code} / bytes %{size_download}\n" "$url"
            grep -q '<!doctype html>' "$RUNNER_TEMP/fmv-live.html"
          done

