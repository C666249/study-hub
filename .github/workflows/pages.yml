name: Deploy to GitHub Pages
on:
  push:
    branches: [master, diagnose-streaming]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify complete Study Atelier release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/StudyAtelier-Mobile-v0.1.zip"
          if [ -d .atelier-parts ]; then
            cat .atelier-parts/p*.bin > "$archive"
            printf '%s  %s\n' '3f64016d6937c1ffa98b5a344118a950af14c4b93f83d67608a2a272c652f8b6' "$archive" | sha256sum -c -
            mkdir -p study-atelier
            unzip -oq "$archive" -d study-atelier
            test -s study-atelier/index.html
            test -s study-atelier/data.js
            test -d study-atelier/originals
            touch study-atelier/.nojekyll
            rm -rf .atelier-parts
            echo "Study Atelier verified at /study-hub/study-atelier/"
          else
            latest=$(find . -maxdepth 1 -type f -name 'StudyAtelier-Mobile-v*.zip' -print | sort -V | tail -n 1)
            if [ -n "$latest" ]; then
              mkdir -p study-atelier
              unzip -oq "$latest" -d study-atelier
              touch study-atelier/.nojekyll
              test -s study-atelier/index.html
            fi
          fi
      - name: Apply Study Atelier v0.2 knowledge and practice upgrade
        shell: bash
        run: |
          set -euo pipefail
          if [ -d study-atelier-overrides ]; then
            test -s study-atelier/index.html
            cp -a study-atelier-overrides/. study-atelier/
            test -s study-atelier/quiz-data.js
            test -s study-atelier/chapter-data.js
            test -s study-atelier/upgrade.js
            rm -rf study-atelier-overrides
            echo 'Study Atelier v0.2 upgrade applied'
          fi
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
