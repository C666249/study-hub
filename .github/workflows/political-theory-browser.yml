name: Political Theory Browser Smoke
on:
  push:
    branches: [master]
    paths:
      - 'political-theory-2026/**'
      - '.github/workflows/political-theory-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser interaction smoke test
        run: |
          python3 -m http.server 8765 > /tmp/political-theory-http.log 2>&1 &
          sleep 1
          node political-theory-2026/smoke.mjs
