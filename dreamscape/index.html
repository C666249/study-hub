<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c17"><title>Dreamscape · Fire AR V1.1</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff;background:#080c17;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;overflow:hidden}#view{position:fixed;inset:0;width:100%;height:100%;touch-action:none}video{display:none}.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(#0509176b,transparent 26%,transparent 62%,#050917a6)}header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 20px) 18px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}small{font-size:10px;letter-spacing:3px;color:#cbd6e8}h1{font-size:26px;letter-spacing:3px;margin:5px 0}#status{border:1px solid #ffffff40;border-radius:50px;padding:10px;background:#111b2ad9;font-size:12px;max-width:140px}footer{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 15px);text-align:center}.hint{font-size:12px;color:#ced8e7;line-height:1.8;margin-bottom:12px;text-shadow:0 2px 5px #000}.tools{display:flex;justify-content:center;gap:8px}button{border:1px solid #ffffff35;border-radius:18px;padding:14px;background:#ffffff22;color:white;font-weight:700;cursor:pointer;white-space:nowrap}.main{background:linear-gradient(120deg,#ee6639,#ffbd62);color:#271307;border:0;flex:1}.screen{position:fixed;inset:0;display:grid;place-items:center;padding:25px;background:#060c1890;backdrop-filter:blur(15px)}.panel{width:min(460px,100%);text-align:center;background:linear-gradient(140deg,#202c3ce8,#0c1321ed);border:1px solid #ffffff2b;border-radius:30px;padding:30px 24px;box-shadow:0 20px 60px #000a}.orb{width:125px;height:125px;border-radius:50%;background:radial-gradient(circle at 50% 57%,#fff6a9,#ffca68 18%,#fb6024 39%,#971b176b 67%,transparent 74%);filter:drop-shadow(0 0 25px #e84c21);margin:auto}.panel p{font-size:14px;line-height:1.85;color:#c0cce0}.panel button{width:100%;margin:6px 0}.secondary{background:#ffffff1a}.error{font-size:12px;color:#ffcdad;overflow-wrap:anywhere}.hide{display:none!important}#reading{position:fixed;top:calc(env(safe-area-inset-top) + 105px);right:18px;max-width:70%;text-align:right;font-size:12px;color:#ffe0c4;text-shadow:0 2px 6px #000}
</style></head><body>
<canvas id="view"></canvas><video id="camera" autoplay muted playsinline></video><div class="shade"></div>
<header><div><small>REALTIME INTERACTIVE AR</small><h1>DREAMSCAPE <span style="font-size:12px;opacity:.5">/ FIRE</span></h1></div><div id="status">等待启动</div></header><div id="reading">抬起手掌，召唤指尖火焰</div>
<footer><div class="hint">食指：火焰跟随 · 拇指与中指捏合后松开：火球爆发<br>双手可同时识别 · 触屏演示可直接点击释放</div><div class="tools"><button id="flip">↻</button><button class="main" id="start">启动摄像头</button><button id="fire">试放火球</button><button id="shot">◎</button></div></footer>
<div class="screen" id="intro"><div class="panel"><div class="orb"></div><h2>唤醒你的火焰</h2><p>手机前置摄像头实时识别手势<br>指尖火焰 · 捏合松手 · 火球爆发</p><button class="main" id="enter">开启 AR 摄像头</button><button class="secondary" id="demo">先体验触屏特效</button><p class="error" id="error">请允许浏览器使用摄像头。首次使用需要联网加载手势模型。</p></div></div>
<script type="module">
const $=id=>document.getElementById(id),c=$('view'),ctx=c.getContext('2d'),v=$('camera');let W,H,dpr,stream=null,tracker=null,active=false,demo=false,front=true,points=[],particles=[],rings=[],lastT=performance.now(),lastDetect=0,lastFrame=-1,slots=[{pinch:false,time:0,fire:0},{pinch:false,time:0,fire:0}],cursor={x:0,y:0};
const rnd=(a,b)=>Math.random()*(b-a)+a,clamp=(x,a,b)=>Math.min(b,Math.max(a,x)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);cursor={x:W*.5,y:H*.46}}addEventListener('resize',resize);resize();
function state(t){$('status').textContent=t}function message(t){$('reading').textContent=t}
function map(p){const s=Math.max(W/(v.videoWidth||W),H/(v.videoHeight||H)),ww=(v.videoWidth||W)*s,hh=(v.videoHeight||H)*s;return{x:(front?1-p.x:p.x)*ww+(W-ww)/2,y:p.y*hh+(H-hh)/2}}
function cam(){const vw=v.videoWidth,vh=v.videoHeight;if(!active||!vw||!vh)return false;const s=Math.max(W/vw,H/vh),ww=vw*s,hh=vh*s,y=(H-hh)/2,x=(W-ww)/2;ctx.save();if(front){ctx.translate(W,0);ctx.scale(-1,1)}ctx.drawImage(v,x,y,ww,hh);ctx.restore();ctx.fillStyle='#080c1726';ctx.fillRect(0,0,W,H);return true}
function bg(t){const g=ctx.createRadialGradient(W*.5,H*.42,5,W*.5,H*.5,Math.max(W,H)*.75);g.addColorStop(0,'#233650');g.addColorStop(.7,'#0b1527');g.addColorStop(1,'#060a14');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function spawn(x,y,n=3,scale=1){for(let i=0;i<n;i++){let a=rnd(-3.0,-.2),s=rnd(1,5)*scale;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(22,55),max:55,r:rnd(2,7)*scale,h:rnd(17,56)})}if(particles.length>850)particles.splice(0,particles.length-850)}
function blast(x,y){rings.push({x,y,age:0});for(let i=0;i<100;i++){let a=rnd(0,Math.PI*2),s=rnd(2,12);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(22,62),max:62,r:rnd(2,6),h:rnd(13,53)})}message('FIREBALL · IGNITED')}
function flame(x,y,t){ctx.save();ctx.globalCompositeOperation='screen';let r=clamp(W*.12,33,68),g=ctx.createRadialGradient(x,y,0,x,y,r*1.8);g.addColorStop(0,'#fff9a4e0');g.addColorStop(.2,'#ffae48ad');g.addColorStop(.55,'#fc522d52');g.addColorStop(1,'#fb351000');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*1.8,0,7);ctx.fill();for(let i=0;i<4;i++){let dx=Math.sin(t*.007+i)*r*.23;ctx.beginPath();ctx.moveTo(x-r*.45,y+r*.3);ctx.bezierCurveTo(x-r,y-r*.2,x+dx-r*.3,y-r*.6,x+dx,y-r*(1+i*.11));ctx.bezierCurveTo(x+r*.45,y-r*.5,x+r*.65,y+r*.2,x+r*.45,y+r*.3);ctx.fillStyle=['#ff582e65','#ffaa3170','#ffda5870','#fff1b665'][i];ctx.fill()}ctx.restore()}
function drawParticles(dt){ctx.save();ctx.globalCompositeOperation='screen';for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.015*dt;const a=clamp(p.life/17,0,1),r=p.r*clamp(p.life/p.max,.1,1),g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*2);g.addColorStop(0,'hsla('+p.h+',100%,92%,'+a+')');g.addColorStop(.4,'hsla('+p.h+',100%,54%,'+(a*.7)+')');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r*2,0,7);ctx.fill()}for(let i=rings.length-1;i>=0;i--){let q=rings[i];q.age+=dt;ctx.beginPath();ctx.arc(q.x,q.y,15+q.age*5,0,7);ctx.strokeStyle='rgba(255,177,68,'+Math.max(0,1-q.age/26)+')';ctx.lineWidth=4;ctx.stroke();if(q.age>26)rings.splice(i,1)}ctx.restore()}
async function loadHands(){
 if(tracker)return;
 state('正在载入手势引擎…');
 const versions=[
  {root:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',name:'jsDelivr'},
  {root:'https://unpkg.com/@mediapipe/tasks-vision@0.10.14',name:'unpkg'},
  {root:'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3',name:'jsDelivr新版'}
 ];
 const modelURLs=[
  'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
  'https://cdn.jsdelivr.net/gh/google-ai-edge/mediapipe@master/mediapipe/tasks/testdata/vision/hand_landmarker.task'
 ];
 const issues=[];
 for(const src of versions){
  let MP,vision;
  try{
   state('加载引擎：'+src.name);
   const mod=await import(src.root+'/vision_bundle.mjs');
   MP=mod.HandLandmarker?mod:mod.default;
   if(!MP?.HandLandmarker||!MP?.FilesetResolver)throw Error('模块缺少HandLandmarker导出');
   vision=await MP.FilesetResolver.forVisionTasks(src.root+'/wasm');
  }catch(e){issues.push(src.name+'引擎：'+(e?.message||e));continue}
  for(const url of modelURLs){
   try{
    state('正在初始化手势模型…');
    tracker=await MP.HandLandmarker.createFromOptions(vision,{
     baseOptions:{modelAssetPath:url,delegate:'CPU'},
     runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.45,
     minHandPresenceConfidence:.45,minTrackingConfidence:.45
    });
    message('模型已就绪 · 请把手掌放到镜头前');
    return;
   }catch(e){issues.push(src.name+'模型：'+(e?.message||e))}
  }
 }
 throw Error(issues.slice(-4).join(' | ').slice(0,420)||'所有模型线路均不可用');
}
async function start(){if(!navigator.mediaDevices?.getUserMedia){$('error').textContent='此页面无法访问摄像头，请通过 HTTPS 地址打开。';$('intro').classList.remove('hide');return}state('正在请求摄像头…');try{const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:front?'user':'environment',width:{ideal:640},height:{ideal:960}}});stop();stream=s;v.srcObject=s;await v.play();active=true;demo=false;$('intro').classList.add('hide');$('start').textContent='关闭摄像头';state('摄像头已开启');try{await loadHands();state('AR 已就绪')}catch(e){state('模型载入失败');message('手势引擎加载失败：'+String(e?.message||e).slice(0,120));console.error('MediaPipe加载失败',e)}}catch(e){state('摄像头启动失败');$('error').textContent='无法开启摄像头：'+e.name+'。请允许摄像头权限，确认 HTTPS，并关闭其他占用摄像头的应用。';$('intro').classList.remove('hide')}}
function stop(){active=false;points=[];if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}v.srcObject=null;$('start').textContent='启动摄像头'}
function track(t){if(!active||!tracker||v.readyState<2||t-lastDetect<70||v.currentTime===lastFrame)return;lastDetect=t;lastFrame=v.currentTime;try{const r=tracker.detectForVideo(v,t);points=[];for(let i=0;i<Math.min(r.landmarks.length,2);i++){const lm=r.landmarks[i],tip=map(lm[8]),a=map(lm[4]),b=map(lm[12]),p=map(lm[9]),w=map(lm[0]),d=dist(a,b)/Math.max(22,dist(p,w)),s=slots[i],pinch=s.pinch?d<.62:d<.43;if(pinch&&!s.pinch)s.time=t;if(!pinch&&s.pinch&&t-s.time>50&&t-s.time<1300&&t-s.fire>750){blast((a.x+b.x)/2,(a.y+b.y)/2);s.fire=t}s.pinch=pinch;points.push(tip)}message(points.length?'检测到 '+points.length+' 只手 · 捏合后松开释放火球':'把手掌放进镜头，保持明亮')}catch(e){console.warn(e)}}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(2.2,(t-lastT)/16.6||1);lastT=t;if(!cam())bg(t);track(t);for(const p of points){flame(p.x,p.y,t);spawn(p.x,p.y,3)}if(demo){flame(cursor.x,cursor.y,t);spawn(cursor.x,cursor.y,3)}drawParticles(dt)}requestAnimationFrame(loop);
function beginDemo(){stop();demo=true;$('intro').classList.add('hide');state('触屏演示');message('移动手指控制火焰 · 点击释放火球')}
$('enter').onclick=start;$('start').onclick=()=>active? (stop(),state('摄像头已关闭')):start();$('demo').onclick=beginDemo;$('flip').onclick=async()=>{front=!front;if(active)await start();else message(front?'已选前置摄像头':'已选后置摄像头')};$('fire').onclick=()=>blast(points[0]?.x??cursor.x,points[0]?.y??cursor.y);
c.addEventListener('pointermove',e=>cursor={x:e.clientX,y:e.clientY});c.addEventListener('pointerdown',e=>{cursor={x:e.clientX,y:e.clientY};if(demo)blast(cursor.x,cursor.y)});
$('shot').onclick=()=>{const a=document.createElement('a');a.download='Dreamscape_Fire_'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click()};addEventListener('pagehide',stop);
</script></body></html>
