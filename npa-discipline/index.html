<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="依据《南京警察学院学生违纪行为处理标准》整理的督察考试刷题与知识点学习工具。">
  <title>纪律研习室 · 督察考试刷题</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<div class="ambient ambient-a" aria-hidden="true"></div><div class="ambient ambient-b" aria-hidden="true"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#home" data-nav="home" aria-label="返回首页">
      <span class="brand-logo"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M10 27.5V12.5h6.5l7 10V12.5H30v15h-6.5l-7-10v10H10Z" fill="white"/><path d="M7 33h26" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".7"/></svg></span>
      <span class="brand-copy"><strong>纪律研习室<span class="brand-dot">.</span></strong><small>DISCIPLINE LAB</small></span>
    </a>
    <div class="side-label">学习空间 <span>WORKSPACE</span></div>
    <nav class="side-nav" aria-label="主导航">
      <button class="nav-item active" data-nav="home"><span class="nav-icon">⌂</span><span>学习首页</span><span class="nav-arrow">↗</span></button>
      <button class="nav-item" data-nav="practice"><span class="nav-icon">◈</span><span>开始刷题</span><span class="nav-arrow">↗</span></button>
      <button class="nav-item" data-nav="wrong"><span class="nav-icon">↺</span><span>错题重练</span><span class="nav-count" id="sideWrong">0</span></button>
      <button class="nav-item" data-nav="saved"><span class="nav-icon">☆</span><span>我的收藏</span><span class="nav-count" id="sideSaved">0</span></button>
      <button class="nav-item" data-nav="learn"><span class="nav-icon">▤</span><span>知识点学习</span><span class="nav-arrow">↗</span></button>
    </nav>
    <div class="side-divider"></div>
    <p class="side-label lower-label">你的学习进度</p>
    <div class="side-progress">
      <div class="side-progress-row"><span>题库掌握度</span><strong id="sidePct">0%</strong></div>
      <div class="progress-track slim"><div id="sideProgressFill" class="progress-fill"></div></div>
      <span class="side-progress-caption" id="sideProgressText">已掌握 0 / 117 道题</span>
    </div>
    <div class="side-bottom">
      <div class="file-chip"><span class="file-chip-icon">PDF</span><span><strong>原始标准 · 3页</strong><small>完整原文可随时查阅</small></span><a href="standard.pdf" target="_blank" rel="noopener" title="打开原始 PDF" aria-label="查看 PDF">↗</a></div>
      <div class="side-footnote">独立备考辅助工具 · 非官方网站</div>
    </div>
  </aside>
  <div class="page-wrap">
    <header class="topbar">
      <div class="breadcrumb"><span class="bc-root">NPA STUDY</span><span class="bc-slash">/</span><span id="breadcrumbCurrent">学习总览</span></div>
      <div class="top-right"><span class="online-indicator"><i></i> 本地学习记录已启用</span><button class="icon-button" id="settingsButton" aria-label="学习设置" title="学习设置">⚙</button><span class="user-badge" aria-label="学习者">学</span></div>
    </header>
    <main class="main" id="main" tabindex="-1" aria-live="polite"></main>
    <footer class="footer"><span>纪律研习室 · 为高效备考而设计</span><span>题目依据用户提供的 3 页标准整理，具体请以最新正式文件为准。</span></footer>
  </div>
</div>
<nav class="mobile-tabbar" aria-label="移动端导航">
  <button data-nav="home"><span>⌂</span>首页</button><button data-nav="practice"><span>◈</span>刷题</button><button data-nav="wrong"><span>↺</span>错题</button><button data-nav="saved"><span>☆</span>收藏</button><button data-nav="learn"><span>▤</span>学习</button>
</nav>
<div class="modal-layer" id="modalLayer" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
