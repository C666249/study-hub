function detail(s){return `<div class="detailhead"><div class="row between wrap"><div class="row wrap"><span class="tag amber">${s.id} / 32</span><span class="tag">第${s.act}场</span><span class="caption mono">${s.tc}</span></div><div class="row"><button class="small" data-step="-1">← 上一段</button><button class="small" data-step="1">下一段 →</button></div></div><h2>${esc(s.title)}</h2><div class="row between"><span class="caption">成片 5 秒 · ${s.post?'后期字幕卡':s.characters.join(' / ')||'场景空镜'}</span><select id="shotStatus" class="statusselect" aria-label="当前进度">${statuses.map(x=>`<option ${x===(saved.status[s.id]||'未开始')?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="detailbody"><section class="section"><div class="row between"><h3>本段参考素材</h3><button class="small" id="copyRefs">复制素材清单</button></div><p class="reference-help">按编号下载并上传本段图片，再复制下方整段提示词。人物板锁脸与衣服，场景图锁环境；不需要另复制生图提示词。</p><div class="refs">${refs(s).map(card).join('')}</div>${s.post?'<p>本段用剪辑软件制作黑底字幕，无需调用视频模型。</p>':''}</section><section class="section"><h3>镜头执行</h3><div class="metadata"><div class="span2"><label>场景与光线</label><p>${esc(s.scene||'黑底字幕')}</p></div><div class="span2"><label>景别 机位 运镜</label><p>${esc(s.camera)}</p></div><div class="span2"><label>动作链与表情变化</label><p>${esc(s.action)}</p></div><div class="span2"><label>对白与声音</label><p>${esc(s.line)} ${esc(s.sound)}</p></div></div></section><section class="section"><div class="row between wrap"><h3>${s.post?'后期执行内容':'整段复制到 Pavo'}</h3><button class="primary" id="copyPrompt">复制完整提示词</button></div><div class="promptbox"><pre class="prompttext" id="promptText">${esc(s.prompt)}</pre></div><div class="row wrap" style="margin-top:14px"><button class="small" id="exportShot">下载本段 TXT</button></div></section><section class="section"><h3>本段制作备注</h3><textarea class="noteinput" id="shotNote" placeholder="记录生成版本、问题和需要调整的细节…">${esc(saved.notes[s.id]||'')}</textarea><p class="caption">本浏览器自动保存；在制作总览可导出进度。</p></section></div>`}
function shots(){const list=filtered();if(list.length&&!list.some(s=>s.id===state.shot))state.shot=list[0].id;const s=list.find(s=>s.id===state.shot);$('#stage').innerHTML=`<section class="shots-layout"><div class="toolbar"><select id="actFilter" aria-label="场次"><option value="">全部场次</option>${DATA.acts.map(a=>`<option value="${a.id}">第${a.id}场 ${a.name}</option>`).join('')}</select><select id="characterFilter" aria-label="人物"><option value="">全部人物</option>${DATA.assets.filter(a=>a.kind==='人物').map(a=>`<option value="${a.id}">${a.id} ${a.name}</option>`).join('')}</select><select id="locationFilter" aria-label="场景"><option value="">全部场景</option>${DATA.assets.filter(a=>a.kind==='场景').map(a=>`<option value="${a.id}">${a.id} ${a.name}</option>`).join('')}</select><select id="statusFilter" aria-label="进度"><option value="">全部进度</option>${statuses.map(x=>`<option>${x}</option>`).join('')}</select><button class="small" id="reset">重置</button><span class="count">${list.length} / 32 段</span></div><div class="shot-columns"><div class="shotlist">${list.map(s=>`<button class="shotitem ${s.id===state.shot?'active':''}" data-shot="${s.id}"><div class="row between"><span class="id">${s.id}${saved.status[s.id]==='已验收'?' ✓':''}</span><span class="info mono">5s</span></div><span class="title">${s.title}</span><div class="info">${s.tc} · ${s.characters.join(' / ')||'后期'} · ${s.backgrounds.join(' / ')}</div></button>`).join('')||'<div class="empty">没有匹配的分镜</div>'}</div><div class="detail" id="shotDetail">${s?detail(s):'<div class="empty">请重置筛选条件</div>'}</div></div></section>`;
for(const [id,k]of[['actFilter','act'],['characterFilter','character'],['locationFilter','location'],['statusFilter','status']]){$('#'+id).value=state[k];$('#'+id).onchange=e=>{remember();state[k]=e.target.value;render()}}
$('#reset').onclick=()=>{Object.assign(state,{act:'',character:'',location:'',status:'',query:''});$('#search').value='';render()};if(s){$('#copyPrompt').onclick=()=>copy(s.prompt);$('#copyRefs').onclick=()=>copy(refs(s).map(a=>a.id+' '+a.name+' '+a.fileName).join('\n')||'后期字幕卡');$('#exportShot').onclick=()=>saveText(s.prompt,s.id+'_'+s.title+'.txt');$('#shotNote').oninput=e=>{saved.notes[s.id]=e.target.value;persist()};$('#shotStatus').onchange=e=>{remember();saved.status[s.id]=e.target.value;persist();render()};$$('[data-step]').forEach(b=>{const i=list.indexOf(s)+Number(b.dataset.step);b.disabled=!list[i];b.onclick=()=>select(list[i].id)})}
$('.shotlist').scrollTop=positions.list||0;$('#shotDetail').style.scrollBehavior='auto';$('#shotDetail').scrollTop=positions[state.shot]||0;
}
function overview(){const count=DATA.shots.filter(s=>saved.status[s.id]==='已验收').length;$('#stage').innerHTML=`<div class="gallerypage"><div class="hero"><img src="${A.B2.src}" alt="夕阳归途"><div class="herocopy"><div class="eyebrow">THAT WORD MOM / V5</div><h2>那声“妈”</h2><p>她知道那是假的，只是太久没听见那声妈。</p><button class="primary" data-goto="shots">进入五秒工作台 →</button></div></div><div class="stats"><div class="stat"><strong>32</strong><span>每段5秒 共2分40秒</span></div><div class="stat"><strong>3</strong><span>A1 至 A3 人物设定</span></div><div class="stat"><strong>7</strong><span>B1 至 B7 横版场景</span></div><div class="stat"><strong>${count}/32</strong><span>本浏览器已验收</span></div></div><h3>按场次进入</h3><div class="acts">${DATA.acts.map(a=>`<button class="actcard" data-act="${a.id}"><span class="eyebrow">ACT 0${a.id}</span><strong>${a.name}</strong><span class="caption">${DATA.shots.filter(s=>s.act===a.id).length}段</span></button>`).join('')}</div><h3>制作约定</h3><p>广场只保留奶奶与陈警官，生活嘈杂来自画外。骗子仅出声，李明仅出现在照片与旧语音。每段只有一个完整提示词，内含动作链、表情变化、景别、运镜、切镜秒点和声音。</p><p>人物设定沿用原版。7张场景由内置图像生成工具新作，原生1672×941，统一重采样导出1920×1080 PNG；网页预览为JPEG，离线单文件内嵌PNG原图。场景是空间参考，人物需通过实际关联的A图锁定，不把人物板直接当作多人首帧。</p><div class="docs"><button id="exportProgress">导出进度备份</button><label class="btn">导入进度<input id="importProgress" type="file" accept="application/json" class="hidden"></label></div><p class="caption">V5使用独立进度，不覆盖旧版记录。S32为后期字幕卡。</p></div>`;$('#exportProgress').onclick=()=>saveText(JSON.stringify({project:key,...saved},null,2),'那声妈_V5_制作进度.json','application/json');$('#importProgress').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.project!==key)throw Error();const ids=new Set(DATA.shots.map(s=>s.id));saved={status:Object.fromEntries(Object.entries(d.status||{}).filter(([k,v])=>ids.has(k)&&statuses.includes(v))),notes:Object.fromEntries(Object.entries(d.notes||{}).filter(([k,v])=>ids.has(k)&&typeof v==='string'))};persist();render();toast('已导入进度')}catch(e){toast('请选择本项目V5进度文件')}}}
function gallery(){const kind=state.view==='characters'?'人物':'场景';const list=DATA.assets.filter(a=>a.kind===kind&&(!state.query||[a.id,a.name,a.summary].join(' ').includes(state.query)));$('#stage').innerHTML=`<div class="gallerypage"><div class="eyebrow">${kind==='人物'?'CAST / A1—A3':'LOCATIONS / B1—B7'}</div><h2>${kind==='人物'?'人物参考':'完整横版场景图'}</h2><p class="muted">${kind==='人物'?'沿用已确认的四视图、表情和细节设定；每个编号只代表一个人。':'7张单幅场景，统一1920×1080交付。相邻镜头优先沿用同一场景，局部机位以主场景空间为准。'}</p><div class="gallery">${list.map(a=>`<div>${card(a)}<p class="caption">${esc(a.summary)}<br>用于 ${a.shots.join('、')}</p></div>`).join('')}</div></div>`}
function guide(){$('#stage').innerHTML=`<div class="guide"><div class="eyebrow">PAVO / IMAGE TO VIDEO</div><h2>一段五秒 一次复制</h2><ol><li>在逐镜工作台选择S01开始的一段，按素材卡上的A和B编号下载并上传图片。</li><li>在Pavo中实际选中并关联本段参考图；编号本身不会自动上传或关联图片。A图负责人物身份，B图负责环境。若当前模型只接受一张首帧，需先把本段人物和环境合成为单幅剧情图，再作为视频输入；不要直接让四视图整张活动。</li><li>选择图生视频与5秒时长，复制本段唯一的完整提示词并提交。无需另复制首帧提示词。生成效果取决于所选模型对多图参考和镜头切换的支持。</li><li>检查长相、左右手、道具和表情是否一致。包含硬切的段落已写清秒点；若切镜执行不稳定，可按同一段内的时间区间分别生成再合并成5秒。</li><li>按编号剪辑，每段只取5秒。对白与环境声的时间要求已包含在提示词中，模型未提供合格音频时按同一台词后期配音。最后S32为5秒后期字幕。</li></ol><h3>素材怎样使用</h3><p>点击“看原图”可放大；“下载”获取当前图。在线缩略图为JPEG预览，点击看原图或下载均获取完整PNG；ZIP和离线工作台同样保留原图。完整包有且只有人物设计图、场景设计图两个文件夹和剧本DOCX；离线工作台另外提供。</p><h3>首尾帧的作用</h3><p>这版重点是完整动作与表情时序，不另外要求你填写首尾帧提示词。人物和场景参考仍需要由所选视频模型组合成单幅剧情画面；角色设定板、场景空图和剧情首帧是不同用途的素材。</p><h3>对白与图中文字</h3><p>原图已做好A3警服照与报纸标题。视频中必须让照片保持静止；报纸揭晓镜头以原图缓慢摇移最稳定。若生成后字形漂移，剪辑中贴回同一张原图的报纸区域。不要让模型另编新闻内容。</p><p>本工作台用于素材与提示词管理，不连接Pavo账户。当前模型选项以你的Pavo界面为准。</p></div>`}
function continuity(){$('#stage').innerHTML=`<div class="guide"><div class="eyebrow">CONTINUITY / V5</div><h2>同一个人 同一个空间</h2><h3>广场轴线</h3><p>B1画面左侧是A1，右侧是A2与宣传桌。太阳从画面右后方来。正反打保持在同一轴线一侧，奶奶看右、陈警官看左；不增路人。</p><h3>归途与入户</h3><p>B2老人背向镜头走向纵深，左手持白布菜袋，手机已收右衣袋。B3用右手开门，进入后切B4厨房，时间从夕阳过渡到暖灯。</p><h3>餐桌调度</h3><p>B5是家庭空间的主图：A1坐左侧，对面右侧椅子始终空着；只有一副碗筷。B6用于饭菜质感，发生位置冲突时以B5为准。手机放A1手边，筷子用右手。</p><h3>纪念柜</h3><p>B7为揭晓镜头的专用主图。A3始终在静态相片内，绝不变成房间里的真人；报纸平放，标题准确。B5远处柜面细节不用于揭晓特写，两镜之间切换完成，不做物体变形转场。</p><h3>声音线索</h3><p>骗子声急促、催钱；A3旧语音温暖自然。前半段环境音稍嘈杂，接电话后压低，归途只留远处孩子声与脚步，室内只留生活声与钟声。没有枪战或牺牲过程闪回。</p></div>`}
function render(){if(!DATA.shots.some(s=>s.id===state.shot))state.shot='S01';$('#viewTitle').textContent=titles[state.view];$$('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));if(state.view==='shots')shots();else if(state.view==='overview')overview();else if(['characters','scenes'].includes(state.view))gallery();else if(state.view==='guide')guide();else continuity();const n=DATA.shots.filter(s=>saved.status[s.id]==='已验收').length;$('#progressText').textContent=n+' / 32';$('#progressBar').style.width=n/32*100+'%';history.replaceState(null,'','#'+state.view+(state.view==='shots'?'/'+state.shot:''));persist();bind()}
function bind(){$$('[data-shot]').forEach(b=>b.onclick=()=>select(b.dataset.shot));$$('[data-asset]').forEach(b=>b.onclick=()=>{const a=A[b.dataset.asset];activeImage=a;$('#viewerTitle').textContent=a.id+' '+a.name;$('#viewerImage').src=a.originalSrc||a.src;$('#viewerImage').alt=a.name;$('#viewerFoot').textContent=a.fileName;$('#modalimgwrap').classList.remove('zoom');$('#viewer').showModal()});$$('[data-download]').forEach(b=>b.onclick=()=>{const a=A[b.dataset.download];download(a.originalSrc||a.src,a.fileName)});$$('[data-goto]').forEach(b=>b.onclick=()=>{remember();state.view=b.dataset.goto;render()});$$('[data-act]').forEach(b=>b.onclick=()=>{remember();Object.assign(state,{view:'shots',act:b.dataset.act,character:'',location:'',status:'',query:''});$('#search').value='';render()})}
$$('nav button').forEach(b=>b.onclick=()=>{remember();state.view=b.dataset.view;render()});$('#closeViewer').onclick=()=>$('#viewer').close();$('#closeCopy').onclick=()=>$('#copyDialog').close();$('#zoomBtn').onclick=()=>$('#modalimgwrap').classList.toggle('zoom');$('#saveImageBtn').onclick=()=>activeImage&&download(activeImage.originalSrc||activeImage.src,activeImage.fileName);$('#openImageBtn').onclick=()=>activeImage&&window.open(activeImage.originalSrc||activeImage.src,'_blank','noopener');let searchTimer;$('#search').value=state.query;$('#search').oninput=e=>{state.query=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(!['shots','characters','scenes'].includes(state.view))state.view='shots';render()},180)};
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||$('#viewer').open||$('#copyDialog').open)return;if(state.view==='shots'&&['ArrowLeft','ArrowRight'].includes(e.key)){const b=$(`[data-step="${e.key==='ArrowLeft'?-1:1}"]`);if(b&&!b.disabled){e.preventDefault();b.click()}}});window.addEventListener('pagehide',()=>{remember();persist()});render();

</script></body></html>
