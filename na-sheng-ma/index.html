function continuity(){$('#stage').innerHTML=`<div class="guide"><div class="eyebrow">CONTINUITY / V5.1</div><h2>同一个人 同一个空间</h2><p>V5.1逐段列出开场和尾态，上一段状态只作已成立条件，禁止前情回放。并联模式不读取实际成片，按预设连接；偏差只需补一句实际尾态。镜头衔接分为连续动作与反应切镜、明确时间省略或物件插镜，不把所有片段强做无缝长镜头。</p><h3>广场轴线</h3><p>B1画面左侧是A1，右侧是A2与宣传桌。太阳从画面右后方来。正反打保持在同一轴线一侧，奶奶看右、陈警官看左；不增路人。</p><h3>归途与入户</h3><p>B2老人背向镜头走向纵深，左手持白布菜袋，手机已收右衣袋。B3用右手开门，进入后切B4厨房，时间从夕阳过渡到暖灯。</p><h3>餐桌调度</h3><p>B5是家庭空间的主图：A1坐左侧，对面右侧椅子始终空着；只有一副碗筷。B6用于饭菜质感，发生位置冲突时以B5为准。手机放A1手边，筷子用右手。</p><h3>纪念柜</h3><p>B7为揭晓镜头的专用主图。A3始终在静态相片内，绝不变成房间里的真人；报纸平放，标题准确。B5远处柜面细节不用于揭晓特写，两镜之间切换完成，不做物体变形转场。</p><h3>声音线索</h3><p>骗子声急促、催钱；A3旧语音温暖自然。前半段环境音稍嘈杂，接电话后压低，归途只留远处孩子声与脚步，室内只留生活声与钟声。没有枪战或牺牲过程闪回。</p></div>`}

function bind(){$$('[data-shot]').forEach(b=>b.onclick=()=>select(b.dataset.shot));$$('[data-asset]').forEach(b=>b.onclick=()=>{const a=A[b.dataset.asset];activeImage=a;$('#viewerTitle').textContent=a.id+' '+a.name;$('#viewerImage').src=a.originalSrc||a.src;$('#viewerImage').alt=a.name;$('#viewerFoot').textContent=a.fileName;$('#modalimgwrap').classList.remove('zoom');$('#viewer').showModal()});$$('[data-download]').forEach(b=>b.onclick=()=>{const a=A[b.dataset.download];download(a.originalSrc||a.src,a.fileName)});$$('[data-goto]').forEach(b=>b.onclick=()=>{remember();state.view=b.dataset.goto;render()});$$('[data-act]').forEach(b=>b.onclick=()=>{remember();Object.assign(state,{view:'shots',act:b.dataset.act,character:'',location:'',status:'',query:''});$('#search').value='';render()})}
$$('nav button').forEach(b=>b.onclick=()=>{remember();state.view=b.dataset.view;render()});$('#closeViewer').onclick=()=>$('#viewer').close();$('#closeCopy').onclick=()=>$('#copyDialog').close();$('#zoomBtn').onclick=()=>$('#modalimgwrap').classList.toggle('zoom');$('#saveImageBtn').onclick=()=>activeImage&&download(activeImage.originalSrc||activeImage.src,activeImage.fileName);$('#openImageBtn').onclick=()=>activeImage&&window.open(activeImage.originalSrc||activeImage.src,'_blank','noopener');let searchTimer;$('#search').value=state.query;$('#search').oninput=e=>{state.query=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(!['shots','characters','scenes'].includes(state.view))state.view='shots';render()},180)};
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||$('#viewer').open||$('#copyDialog').open)return;if(state.view==='shots'&&['ArrowLeft','ArrowRight'].includes(e.key)){const b=$(`[data-step="${e.key==='ArrowLeft'?-1:1}"]`);if(b&&!b.disabled){e.preventDefault();b.click()}}});window.addEventListener('pagehide',()=>{remember();persist()});render();

</script></body></html>
